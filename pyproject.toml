[project]
name = "starcoach-torob-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.10", "httpx>=0.28", "jsonschema>=4.23"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
